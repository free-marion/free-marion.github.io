<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournaments & Events — Cherrywood Farm & Golf Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .events-hero {
      background: var(--green);
      padding: 6rem 1.5rem 3rem;
      text-align: center;
    }
    .events-hero__kicker {
      font-family: var(--body);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--blossom);
      margin-bottom: 0.75rem;
    }
    .events-hero__title {
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--cream);
      font-weight: 400;
    }

    .events-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* ── Calendar nav ── */
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .cal-nav__title {
      font-family: var(--serif);
      font-size: 1.5rem;
      color: var(--ink);
      font-weight: 400;
    }
    .cal-nav__btn {
      background: none;
      border: 1px solid var(--cream-dark);
      border-radius: 5px;
      padding: 0.4rem 0.9rem;
      font-family: var(--body);
      font-size: 1rem;
      color: var(--green);
      cursor: pointer;
      transition: background 0.2s;
    }
    .cal-nav__btn:hover { background: var(--cream-dark); }
    .cal-nav__today {
      font-family: var(--body);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-faint);
      background: none;
      border: 1px solid var(--cream-dark);
      border-radius: 5px;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .cal-nav__today:hover { background: var(--cream-dark); }

    /* ── Calendar grid ── */
    .cal-grid {
      border: 1px solid var(--cream-dark);
      border-radius: 10px;
      overflow: hidden;
      background: var(--off-white);
      margin-bottom: 2.5rem;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--green);
    }
    .cal-weekday {
      font-family: var(--body);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cream);
      text-align: center;
      padding: 0.6rem 0;
      opacity: 0.8;
    }
    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .cal-day {
      min-height: 100px;
      border-right: 1px solid var(--cream-dark);
      border-bottom: 1px solid var(--cream-dark);
      padding: 0.4rem;
      position: relative;
      background: var(--off-white);
      transition: background 0.15s;
    }
    .cal-day:nth-child(7n) { border-right: none; }
    .cal-day--empty { background: var(--parchment); }
    .cal-day--today { background: #f0f7f4; }
    .cal-day--today .cal-day__num {
      background: var(--green);
      color: var(--cream);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cal-day--past { opacity: 0.6; }
    .cal-day__num {
      font-family: var(--body);
      font-size: 0.8rem;
      color: var(--ink-mid);
      margin-bottom: 0.3rem;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cal-event-chip {
      display: block;
      font-family: var(--body);
      border-radius: 5px;
      padding: 0.4rem 0.5rem;
      margin-top: 0.15rem;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      border-left: 3px solid transparent;
      width: 100%;
      box-sizing: border-box;
    }
    .cal-event-chip:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .cal-event-chip__name {
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 0.15rem;
    }
    .cal-event-chip__time {
      font-size: 0.6rem;
      font-weight: 600;
      opacity: 0.9;
      margin-bottom: 0.1rem;
    }
    .cal-event-chip__type {
      font-size: 0.58rem;
      opacity: 0.75;
      line-height: 1.3;
      margin-bottom: 0.1rem;
    }
    .cal-event-chip__slots {
      font-size: 0.6rem;
      font-weight: 600;
      margin-top: 0.15rem;
    }

    /* Urgency colors */
    .chip--open     { background: #e6f0eb; color: var(--green);    border-left-color: var(--green); }
    .chip--low      { background: #fff4e0; color: #8a5700;         border-left-color: #d4870a; }
    .chip--critical { background: #fdecea; color: #a00;            border-left-color: #c0392b; }
    .chip--soldout  { background: var(--burgundy); color: #fff;    border-left-color: #5a0010; }
    .chip--past     { background: #f0f0f0; color: var(--ink-faint); border-left-color: #ccc; }
    .chip--cancelled{ background: #f5f5f5; color: #aaa;            border-left-color: #ddd; text-decoration: line-through; }
    .chip--draft    { background: #eef2f7; color: #4a6080;         border-left-color: #8aa3c0; }
    .chip--closed   { background: #f5f0e8; color: #6b4a1a;         border-left-color: #c8a86b; }

    /* ── Event detail panel ── */
    .event-detail {
      background: var(--off-white);
      border: 1px solid var(--cream-dark);
      border-radius: 10px;
      padding: 1.75rem;
      margin-bottom: 2rem;
      display: none;
    }
    .event-detail--visible { display: block; }
    .event-detail__close {
      float: right;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--ink-faint);
      line-height: 1;
      padding: 0;
    }
    .event-detail__close:hover { color: var(--ink); }
    .event-detail__title {
      font-family: var(--serif);
      font-size: 1.4rem;
      color: var(--ink);
      margin-bottom: 0.3rem;
    }
    .event-detail__meta {
      font-size: 0.82rem;
      color: var(--ink-mid);
      margin-bottom: 0.75rem;
    }
    .event-detail__badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }
    .badge {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-family: var(--body);
    }
    .badge--individual { background: #e6f0eb; color: var(--green); }
    .badge--team       { background: #f0e8d6; color: #6b4a1a; }
    .badge--format     { background: var(--cream-dark); color: var(--ink-mid); }
    .badge--fee        { background: #fef9ec; color: #7a5a10; border: 1px solid #e8d48a; }
    .event-detail__slots {
      font-family: var(--body);
      font-size: 0.85rem;
      color: var(--ink-mid);
      margin-bottom: 1rem;
    }
    .event-detail__slots strong { color: var(--green); }
    .slots-low { color: #c0392b !important; }
    .event-detail__desc {
      font-size: 0.88rem;
      color: var(--ink-mid);
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }
    .soldout-banner {
      display: inline-block;
      background: var(--burgundy);
      color: #fff;
      font-family: var(--body);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
    .cancelled-tag {
      display: inline-block;
      font-family: var(--body);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #f8e8e8;
      color: #a00;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      margin-bottom: 0.75rem;
    }

    /* ── Registration form ── */
    .reg-form { display: grid; gap: 0.6rem; margin-top: 1rem; }
    .reg-form input {
      width: 100%;
      font-family: var(--body);
      font-size: 0.85rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--cream-dark);
      border-radius: 5px;
      background: var(--cream);
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
    }
    .reg-form input:focus { border-color: var(--green); }
    .reg-form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .reg-form__error { font-size: 0.8rem; color: #c0392b; display: none; }
    .reg-form__error--visible { display: block; }
    .reg-form__success { font-size: 0.88rem; color: var(--green); font-family: var(--body); padding: 0.6rem 0; }
    .reg-form__actions { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.4rem; }
    .btn-register {
      font-family: var(--body);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.55rem 1.4rem;
      background: var(--green);
      color: var(--cream);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-register:hover { background: var(--bark); }
    .btn-register:disabled { background: var(--ink-faint); cursor: default; }
    .btn-reg-submit {
      font-family: var(--body);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.55rem 1.4rem;
      background: var(--green);
      color: var(--cream);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-reg-submit:hover { background: var(--bark); }
    .btn-reg-submit:disabled { background: var(--ink-faint); cursor: default; }
    .btn-cancel-reg {
      font-family: var(--body);
      font-size: 0.8rem;
      color: var(--ink-mid);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }

    /* ── Upcoming events list ── */
    .upcoming-section { margin-top: 1rem; }
    .upcoming-section__title {
      font-family: var(--serif);
      font-size: 1.35rem;
      color: var(--ink);
      font-weight: 400;
      margin-bottom: 1.25rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--cream-dark);
    }
    .event-list { display: flex; flex-direction: column; }
    .event-list-item {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.9rem 0.5rem;
      border-bottom: 1px solid var(--cream-dark);
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .event-list-item:first-child { border-top: 1px solid var(--cream-dark); }
    .event-list-item:hover { background: var(--parchment); }
    .event-list-item__date {
      font-family: var(--body);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--green);
      min-width: 5.5rem;
      flex-shrink: 0;
    }
    .event-list-item__info { flex: 1; min-width: 0; }
    .event-list-item__name {
      font-family: var(--serif);
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.25;
      margin-bottom: 0.15rem;
    }
    .event-list-item__meta {
      font-family: var(--body);
      font-size: 0.75rem;
      color: var(--ink-faint);
    }
    .event-list-item__action { flex-shrink: 0; }
    .btn-list-register {
      font-family: var(--body);
      font-size: 0.75rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 0.45rem 1.1rem;
      background: var(--green);
      color: var(--cream);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-list-register:hover { background: var(--bark); }
    .no-upcoming {
      font-style: italic;
      color: var(--ink-faint);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .cal-day { min-height: 70px; }
      .cal-event-chip { padding: 0.3rem 0.35rem; }
      .cal-event-chip__name { font-size: 0.58rem; }
      .cal-event-chip__time { display: none; }
      .cal-event-chip__type { display: none; }
      .cal-event-chip__slots { display: none; }
      .reg-form__row { grid-template-columns: 1fr; }
      .cal-weekday { font-size: 0.6rem; }
      .event-list-item { flex-wrap: wrap; gap: 0.5rem; }
      .event-list-item__date { min-width: auto; }
      .event-list-item__action { width: 100%; }
      .btn-list-register { width: 100%; text-align: center; }
    }
  </style>
</head>

  <header class="events-hero">
    <p class="events-hero__kicker">Cherrywood Farm & Golf Club</p>
    <h1 class="events-hero__title">Tournaments & Events</h1>
  </header>

  <div class="events-container">

    <!-- Calendar nav -->
    <div class="cal-nav">
      <button class="cal-nav__btn" id="prevMonthBtn">&#8592;</button>
      <div style="display:flex;align-items:center;gap:1rem;">
        <h2 class="cal-nav__title" id="calTitle"></h2>
        <button class="cal-nav__today" id="todayBtn">Today</button>
      </div>
      <button class="cal-nav__btn" id="nextMonthBtn">&#8594;</button>
    </div>

    <!-- Event detail panel (shown when event clicked) -->
    <div class="event-detail" id="eventDetail">
      <button class="event-detail__close" id="closeDetail">✕</button>
      <div id="eventDetailContent"></div>
    </div>

    <!-- Calendar grid -->
    <div class="cal-grid">
      <div class="cal-weekdays">
        <div class="cal-weekday">Sun</div>
        <div class="cal-weekday">Mon</div>
        <div class="cal-weekday">Tue</div>
        <div class="cal-weekday">Wed</div>
        <div class="cal-weekday">Thu</div>
        <div class="cal-weekday">Fri</div>
        <div class="cal-weekday">Sat</div>
      </div>
      <div class="cal-days" id="calDays"></div>
    </div>

    <!-- Upcoming event cards -->
    <div class="upcoming-section">
      <h3 class="upcoming-section__title">Upcoming Events</h3>
      <div class="event-list" id="eventCardsGrid"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="src/event-utils.js"></script>
  <script>
    const SUPABASE_URL  = 'https://giwfigekjatujubjknjf.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdpd2ZpZ2VramF0dWp1YmprbmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMDEwMDMsImV4cCI6MjA4OTU3NzAwM30.p3OaPA5qYROqz8d0tNyhytl__n_bzH2l2MOX3olDn3A';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    let allTournaments = [];
    let viewYear       = new Date().getFullYear();
    let viewMonth      = new Date().getMonth(); // 0-based
    let selectedEvent  = null;
    let showingRegForm = false;

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    async function loadTournaments() {
      // Private venue bookings never appear on the public site
      const { data } = await db.from('tournaments').select('*').neq('type', 'venue').order('date', { ascending: true });
      allTournaments = data || [];
      renderCalendar();
    }

    // Live updates: when any tournament row changes (e.g. registered_count ticked by trigger),
    // patch allTournaments in place and re-render — no full reload needed.
    function subscribeToTournamentUpdates() {
      db.channel('public:tournaments')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'tournaments' }, payload => {
          const updated = payload.new;
          const idx = allTournaments.findIndex(t => t.id === updated.id);
          if (idx !== -1) {
            allTournaments[idx] = { ...allTournaments[idx], ...updated };
            renderCalendar();
          }
        })
        .subscribe();
    }

    function renderCalendar() {
      document.getElementById('calTitle').textContent = `${MONTHS[viewMonth]} ${viewYear}`;

      const today     = new Date();
      const todayStr  = today.toISOString().split('T')[0];
      const firstDay  = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sun
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

      // Index tournaments by date for this month
      const byDate = {};
      allTournaments.forEach(t => {
        const d = new Date(t.date + 'T00:00:00');
        if (d.getFullYear() === viewYear && d.getMonth() === viewMonth) {
          const key = t.date;
          if (!byDate[key]) byDate[key] = [];
          byDate[key].push(t);
        }
      });

      const grid = document.getElementById('calDays');
      grid.innerHTML = '';

      // Empty cells before first day
      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day cal-day--empty';
        grid.appendChild(empty);
      }

      // Day cells
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isPast  = dateStr < todayStr;
        const isToday = dateStr === todayStr;

        const cell = document.createElement('div');
        cell.className = 'cal-day' + (isPast ? ' cal-day--past' : '') + (isToday ? ' cal-day--today' : '');

        const numEl = document.createElement('div');
        numEl.className = 'cal-day__num';
        numEl.textContent = d;
        cell.appendChild(numEl);

        // Add event chips
        (byDate[dateStr] || []).forEach(t => {
          const chip = buildCalChip(t, isPast);
          chip.addEventListener('click', () => {
            showEventDetail(t);
            document.getElementById('eventDetail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          });
          cell.appendChild(chip);
        });

        grid.appendChild(cell);
      }
      renderEventCards();
    }

    const { urgencyClass, slotsLabel } = EventUtils;

    function buildCalChip(t, isPast) {
      const urgency = urgencyClass(t, isPast);

      let timeStr = '';
      if (t.time) {
        const [h, m] = t.time.split(':');
        const dt = new Date(); dt.setHours(+h, +m);
        timeStr = dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      }

      const typeLabel = t.type === 'venue'
        ? '🎉 Private'
        : t.type === 'team'
          ? `👥 Team${t.team_size ? ' · ' + t.team_size + 'p' : ''}`
          : '🏌️ Indiv.';
      const infoStr = t.format ? `${typeLabel} · ${esc(t.format)}` : typeLabel;

      const chip = document.createElement('span');
      chip.className = `cal-event-chip chip--${urgency}`;
      chip.innerHTML = `
        <div class="cal-event-chip__name">${esc(t.name)}</div>
        ${timeStr ? `<div class="cal-event-chip__time">${timeStr}</div>` : ''}
        <div class="cal-event-chip__type">${infoStr}</div>
        ${slotsLabel(t, urgency) ? `<div class="cal-event-chip__slots">${slotsLabel(t, urgency)}</div>` : ''}
      `;
      return chip;
    }

    function renderEventCards() {
      const list  = document.getElementById('eventCardsGrid');
      const today = new Date().toISOString().split('T')[0];
      const upcoming = allTournaments.filter(t =>
        t.date >= today && t.status !== 'cancelled' && t.status !== 'draft'
      );

      if (!upcoming.length) {
        list.innerHTML = '<p class="no-upcoming">No upcoming events scheduled. Check back soon.</p>';
        return;
      }

      list.innerHTML = '';
      upcoming.forEach(t => {
        const urgency = urgencyClass(t, false);
        const isOpen  = t.status === 'open' && urgency !== 'soldout';

        const d = new Date(t.date + 'T00:00:00');
        const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        const metaParts = [];
        if (t.time) {
          const [h, m] = t.time.split(':');
          const dt = new Date(); dt.setHours(+h, +m);
          metaParts.push(dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }));
        }
        if (t.format)    metaParts.push(esc(t.format));
        if (t.entry_fee) metaParts.push('$' + parseFloat(t.entry_fee).toFixed(0) + ' entry');

        const item = document.createElement('div');
        item.className = 'event-list-item';
        item.innerHTML = `
          <div class="event-list-item__date">${esc(dateStr)}</div>
          <div class="event-list-item__info">
            <div class="event-list-item__name">${esc(t.name)}</div>
            ${metaParts.length ? `<div class="event-list-item__meta">${metaParts.join(' · ')}</div>` : ''}
          </div>
          <div class="event-list-item__action">
            ${isOpen ? `<button class="btn-list-register" data-id="${t.id}">Register Now →</button>` : ''}
          </div>
        `;

        if (isOpen) {
          item.querySelector('.btn-list-register').addEventListener('click', e => {
            e.stopPropagation();
            showEventDetail(t);
            setTimeout(() => {
              document.getElementById('openRegBtn')?.click();
              document.getElementById('eventDetail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 80);
          });
        }
        item.addEventListener('click', () => {
          showEventDetail(t);
          document.getElementById('eventDetail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        list.appendChild(item);
      });
    }

    function showEventDetail(t) {
      selectedEvent  = t;
      showingRegForm = false;
      const today     = new Date().toISOString().split('T')[0];
      const isPast    = t.date < today;
      const isCancelled = t.status === 'cancelled';
      const count     = t.registered_count || 0;
      const remaining = t.max_slots > 0 ? t.max_slots - count : null;
      const isSoldOut = remaining !== null && remaining <= 0;
      const isOpen    = !isPast && !isCancelled && !isSoldOut && t.status === 'open' && t.type !== 'venue';

      const d       = new Date(t.date + 'T00:00:00');
      const dateStr = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      let timeStr   = '';
      if (t.time) {
        const [h, m] = t.time.split(':');
        const dt = new Date(); dt.setHours(+h, +m);
        timeStr = ' · ' + dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      }

      let slotsHtml = '';
      if (isSoldOut) {
        slotsHtml = '<div class="soldout-banner">Sold Out</div>';
      } else if (remaining !== null) {
        const cls = remaining <= 3 ? 'slots-low' : '';
        slotsHtml = `<p class="event-detail__slots"><strong>${remaining}</strong> <span class="${cls}">of ${t.max_slots} ${t.type === 'team' ? 'team slots' : 'spots'} remaining</span></p>`;
      } else if (count > 0) {
        slotsHtml = `<p class="event-detail__slots"><strong>${count}</strong> registered</p>`;
      }

      document.getElementById('eventDetailContent').innerHTML = `
        ${isCancelled ? '<div class="cancelled-tag">Cancelled</div>' : ''}
        <h3 class="event-detail__title">${esc(t.name)}</h3>
        <p class="event-detail__meta">${dateStr}${timeStr}</p>
        <div class="event-detail__badges">
          ${t.type === 'venue'
            ? `<span class="badge badge--format">🎉 Private Venue Event</span>`
            : `<span class="badge badge--${t.type}">${t.type === 'team' ? '👥 Team' : '🏌️ Individual'}${t.type === 'team' && t.team_size ? ' · ' + t.team_size + ' players' : ''}</span>`}
          ${t.format    ? `<span class="badge badge--format">${esc(t.format)}</span>` : ''}
          ${t.entry_fee ? `<span class="badge badge--fee">$${parseFloat(t.entry_fee).toFixed(0)} entry — collected at the Clubhouse</span>` : ''}
        </div>
        ${slotsHtml}
        ${t.description ? `<p class="event-detail__desc">${esc(t.description)}</p>` : ''}
        ${isOpen ? `<div class="reg-form__actions"><button class="btn-register" id="openRegBtn">Register for this Event →</button></div>` : ''}
        <div id="regFormArea"></div>
      `;

      document.getElementById('openRegBtn')?.addEventListener('click', () => showRegForm(t));

      const detail = document.getElementById('eventDetail');
      detail.classList.add('event-detail--visible');
      detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function showRegForm(t) {
      const isTeam = t.type === 'team';
      document.getElementById('regFormArea').innerHTML = `
        <div class="reg-form" id="regFormInner">
          <input type="text" id="rf-player1" placeholder="Player 1 name *">
          ${isTeam ? `<input type="text" id="rf-player2" placeholder="Player 2 name *">` : ''}
          <div class="reg-form__row">
            <input type="tel"   id="rf-phone" placeholder="Phone *">
            <input type="email" id="rf-email" placeholder="Email (optional)">
          </div>
          <label style="display:flex;align-items:center;gap:0.6rem;font-family:inherit;font-size:0.95rem;cursor:pointer;">
            <input type="checkbox" id="rf-cart" style="width:16px;height:16px;accent-color:#004331;">
            I'll need a cart
          </label>
          <p class="reg-form__error" id="rf-err"></p>
          <div class="reg-form__actions">
            <button class="btn-reg-submit" id="rf-submit">Submit Registration</button>
            <button class="btn-cancel-reg" id="rf-cancel">Cancel</button>
          </div>
        </div>
      `;
      document.getElementById('openRegBtn').style.display = 'none';
      document.getElementById('rf-submit').addEventListener('click', () => submitReg(t));
      document.getElementById('rf-cancel').addEventListener('click', () => {
        document.getElementById('regFormArea').innerHTML = '';
        document.getElementById('openRegBtn').style.display = '';
      });
    }

    async function submitReg(t) {
      const isTeam  = t.type === 'team';
      const player1 = document.getElementById('rf-player1').value.trim();
      const player2 = isTeam ? document.getElementById('rf-player2')?.value.trim() : null;
      const phone   = document.getElementById('rf-phone').value.trim();
      const email   = document.getElementById('rf-email').value.trim();
      const cart    = document.getElementById('rf-cart').checked;
      const errEl   = document.getElementById('rf-err');
      const btn     = document.getElementById('rf-submit');
      errEl.className = 'reg-form__error';

      if (!player1)           { showErr(errEl, 'Please enter Player 1\'s name.'); return; }
      if (isTeam && !player2) { showErr(errEl, 'Please enter Player 2\'s name.'); return; }
      if (!phone)             { showErr(errEl, 'Please enter a phone number.'); return; }

      // Re-check slots
      const { count } = await db
        .from('tournament_registrations')
        .select('*', { count: 'exact', head: true })
        .eq('tournament_id', t.id)
        .eq('status', 'confirmed');
      if (t.max_slots > 0 && count >= t.max_slots) {
        showErr(errEl, 'Sorry — this event just filled up.'); return;
      }

      btn.disabled = true; btn.textContent = 'Submitting…';

      const { data: inserted, error } = await db.from('tournament_registrations').insert({
        tournament_id: t.id,
        captain_name:  player1,
        team_name:     player2 || null,
        phone,
        email:         email || null,
        num_players:   t.type === 'team' ? (t.team_size || 1) : 1,
        cart,
        status:        'confirmed',
      }).select('id').single();

      if (error) {
        btn.disabled = false; btn.textContent = 'Submit Registration';
        showErr(errEl, 'Something went wrong. Please try again.'); return;
      }

      // Fire confirmation email (non-blocking — don't fail registration if email fails)
      let confNo = '';
      if (email && inserted?.id) {
        try {
          const cfRes = await fetch(`${SUPABASE_URL}/functions/v1/send-registration-confirmation`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON },
            body: JSON.stringify({ registration_id: inserted.id }),
          });
          const cfData = await cfRes.json();
          if (cfData.confirmation_no) confNo = cfData.confirmation_no;
        } catch (e) { /* email failed silently — registration still succeeded */ }
      }

      const emailNote = email
        ? (confNo ? ` A confirmation email is on its way to ${email}.` : ` (Confirmation email will arrive shortly.)`)
        : '';
      document.getElementById('regFormArea').innerHTML =
        `<p class="reg-form__success">✓ You're registered!${confNo ? ' <strong>Confirmation #' + confNo + '</strong>' : ''}${emailNote}</p>`;
      document.getElementById('openRegBtn').style.display = 'none';
      renderCalendar();
      renderEventCards();
    }

    function showErr(el, msg) {
      el.textContent = msg;
      el.className = 'reg-form__error reg-form__error--visible';
    }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Controls ──
    document.getElementById('prevMonthBtn').addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      closeDetail();
      renderCalendar();
    });

    document.getElementById('nextMonthBtn').addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      closeDetail();
      renderCalendar();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      viewYear  = new Date().getFullYear();
      viewMonth = new Date().getMonth();
      closeDetail();
      renderCalendar();
    });

    document.getElementById('closeDetail').addEventListener('click', closeDetail);

    function closeDetail() {
      document.getElementById('eventDetail').classList.remove('event-detail--visible');
      selectedEvent = null;
    }

    // ── Nav toggle (mobile) ──
    document.getElementById('navToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('nav-open');
    });

    loadTournaments();
    subscribeToTournamentUpdates();
  </script>
</body>
</html>
