<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="/portal/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cherrywood">
  <link rel="apple-touch-icon" href="/portal/icon-192.png">
  <meta name="theme-color" content="#1C3320">
  <title>Cherrywood Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<!-- SIGN IN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1 class="login-title">Cherrywood</h1>
    <p class="login-sub">Team Portal</p>
    <button id="loginBtn" class="btn-google" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.658 11.83 17.64 9.525 17.64 9.2z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.548 0 9s.348 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>
    <p id="loginError" class="error-msg" hidden></p>
  </div>
</div>

<!-- ACCESS DENIED -->
<div id="accessDeniedScreen" class="login-screen" hidden>
  <div class="login-card">
    <h1 class="login-title">Cherrywood</h1>
    <p class="login-sub">Team Portal</p>
    <div class="access-denied-msg">
      <p style="margin-bottom:0.4rem;color:#666;font-size:0.88rem;">Signed in as</p>
      <strong id="deniedEmail" style="font-size:0.9rem;color:#1C3320;word-break:break-all;"></strong>
      <p style="margin-top:1rem;color:#666;font-size:0.85rem;line-height:1.5;">Your account hasn't been granted portal access yet. Contact Joel to get set up.</p>
    </div>
    <button onclick="signOut()" class="btn btn--ghost btn--full" style="margin-top:1.25rem;">Sign Out</button>
  </div>
</div>

<!-- APP -->
<div id="appShell" hidden>

  <header class="portal-header">
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <span class="portal-header__title">Cherrywood</span>
    </div>
    <div class="portal-header__right" style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
      <span id="userLabel" class="portal-user-label"></span>
      <span id="roleLabel" class="portal-role-badge"></span>
      <a href="https://cherrywoodgolf.com" class="btn btn--ghost btn--sm">← Site</a>
      <button class="btn btn--ghost btn--sm" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app-body">
    <nav class="sidebar" id="sidebar">
      <button class="tab-btn tab-btn--active" data-tab="tournaments">Tournaments</button>
      <button class="tab-btn" data-tab="eggs">Egg Orders</button>
    </nav>
    <div class="content-area">

      <!-- TOURNAMENTS -->
      <section id="tabTournaments" class="tab-panel tab-panel--active">
        <div class="panel-header">
          <h2 class="panel-title">Tournaments</h2>
          <button id="addTournamentBtn" class="btn btn--primary btn--sm">+ Create Tournament</button>
        </div>

        <div id="tournamentForm" class="inline-form" hidden>
          <input type="text" id="tName" placeholder="Tournament name *" maxlength="120">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem">
            <input type="date" id="tDate">
            <input type="time" id="tTime">
          </div>
          <textarea id="tDesc" placeholder="Description" rows="2" style="font-family:inherit;padding:0.55rem 0.75rem;border:1px solid #d4c8b0;border-radius:5px;resize:vertical;"></textarea>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.6rem">
            <select id="tType" style="font-family:inherit;padding:0.55rem 0.75rem;border:1px solid #d4c8b0;border-radius:5px;">
              <option value="individual">Individual</option>
              <option value="team">Team</option>
            </select>
            <input type="number" id="tTeamSize" placeholder="Team size" min="1">
            <input type="number" id="tMaxSlots" placeholder="Max slots *" min="0">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem">
            <input type="text"   id="tFormat"   placeholder="Format (e.g. Scramble)">
            <input type="number" id="tEntryFee" placeholder="Entry fee ($)" step="0.01" min="0">
          </div>
          <select id="tStatus" style="font-family:inherit;padding:0.55rem 0.75rem;border:1px solid #d4c8b0;border-radius:5px;">
            <option value="draft">Draft</option>
            <option value="open">Open</option>
            <option value="closed">Closed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <textarea id="tNotes" placeholder="Internal notes (not shown publicly)" rows="2" style="font-family:inherit;padding:0.55rem 0.75rem;border:1px solid #d4c8b0;border-radius:5px;resize:vertical;"></textarea>
          <p id="tournamentFormError" class="error-msg" hidden></p>
          <div class="inline-form__actions">
            <button id="saveTournamentBtn"   class="btn btn--primary btn--sm">Save Tournament</button>
            <button id="cancelTournamentBtn" class="btn btn--ghost btn--sm">Cancel</button>
          </div>
        </div>

        <div id="tournamentsList"></div>
        <p id="tournamentsEmpty" class="empty-msg" hidden>No tournaments yet. Create one above.</p>

        <div id="registrationsPanel" hidden>
          <div class="panel-header" style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid #e8dfc8;">
            <h3 id="regPanelTitle" style="font-family:'Playfair Display',serif;font-size:1.05rem;color:#1C3320;"></h3>
            <button id="closeRegPanel" class="btn btn--ghost btn--sm">← Back</button>
          </div>
          <div id="registrationsList"></div>
          <p id="registrationsEmpty" class="empty-msg" hidden>No registrations yet.</p>
        </div>
      </section>

      <!-- EGG ORDERS -->
      <section id="tabEggs" class="tab-panel" hidden>
        <div class="panel-header">
          <h2 class="panel-title">Egg Orders</h2>
          <div class="filter-row">
            <button class="filter-btn filter-btn--active" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="all">All</button>
          </div>
        </div>
        <div id="eggsList"></div>
        <p id="eggsEmpty" class="empty-msg" hidden>No egg orders found.</p>
      </section>

    </div><!-- /content-area -->
  </div><!-- /app-body -->
</div><!-- /appShell -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=50"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
  }
</script>
</body>
</html>
