<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherrywood Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1 class="login-title">Cherrywood</h1>
    <p class="login-sub">Team Portal</p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <p id="loginError" class="error-msg" hidden></p>
      <button type="submit" id="loginBtn" class="btn btn--primary btn--full">Sign In</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appShell" hidden>

  <header class="portal-header">
    <span class="portal-header__title">Cherrywood</span>
    <div class="portal-header__right">
      <span id="userEmail" class="user-email"></span>
      <a href="https://cherrywoodgolf.com" class="btn btn--ghost btn--sm">← Site</a>
      <button class="btn btn--ghost btn--sm" onclick="(async()=>{ await db.auth.signOut(); window.location.reload(); })()">Sign Out</button>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn tab-btn--active" data-tab="vto">V/TO</button>
    <button class="tab-btn" data-tab="bookings">Bookings</button>
    <button class="tab-btn" data-tab="eggs">Egg Orders</button>
    <button class="tab-btn" data-tab="todos">My To-Dos</button>
    <button class="tab-btn" data-tab="docs">Documents</button>
  </nav>

  <!-- V/TO -->
  <section id="tabVto" class="tab-panel tab-panel--active">
    <div class="panel-header"><h2 class="panel-title">Vision / Traction Organizer</h2></div>
    <div id="vtoContent" class="vto-grid"></div>
  </section>

  <!-- BOOKINGS -->
  <section id="tabBookings" class="tab-panel" hidden>
    <div class="panel-header">
      <h2 class="panel-title">Tee Time Bookings</h2>
      <div class="filter-row">
        <button class="filter-btn filter-btn--active" data-filter="upcoming">Upcoming</button>
        <button class="filter-btn" data-filter="all">All</button>
      </div>
    </div>
    <div id="bookingsList"></div>
    <p id="bookingsEmpty" class="empty-msg" hidden>No bookings found.</p>
  </section>

  <!-- EGG ORDERS -->
  <section id="tabEggs" class="tab-panel" hidden>
    <div class="panel-header">
      <h2 class="panel-title">Egg Orders</h2>
      <div class="filter-row">
        <button class="filter-btn filter-btn--active" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="all">All</button>
      </div>
    </div>
    <div id="eggsList"></div>
    <p id="eggsEmpty" class="empty-msg" hidden>No egg orders found.</p>
  </section>

  <!-- TO-DOS -->
  <section id="tabTodos" class="tab-panel" hidden>
    <div class="panel-header">
      <h2 class="panel-title">My To-Dos</h2>
      <button id="addTodoBtn" class="btn btn--primary btn--sm">+ Add</button>
    </div>
    <div id="todoForm" class="inline-form" hidden>
      <input type="text" id="todoTitle" placeholder="What needs to be done?" maxlength="200">
      <input type="date" id="todoDue">
      <div class="inline-form__actions">
        <button id="saveTodoBtn" class="btn btn--primary btn--sm">Save</button>
        <button id="cancelTodoBtn" class="btn btn--ghost btn--sm">Cancel</button>
      </div>
    </div>
    <div id="todosList"></div>
    <p id="todosEmpty" class="empty-msg" hidden>No to-dos yet.</p>
  </section>

  <!-- DOCUMENTS -->
  <section id="tabDocs" class="tab-panel" hidden>
    <div class="panel-header"><h2 class="panel-title">Document Vault</h2></div>
    <div class="docs-card">
      <div class="docs-icon">📁</div>
      <h3>Cherrywood Shared Drive</h3>
      <p>All company documents, forms, and resources.</p>
      <a href="https://drive.google.com/drive/folders/1dEpiEXbIOwgCCM1ZdUCACBpZyg_jLpz3?usp=drive_link"
         target="_blank" class="btn btn--primary">Open Google Drive →</a>
    </div>
  </section>

</div><!-- /appShell -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=4"></script>
</body>
</html>
